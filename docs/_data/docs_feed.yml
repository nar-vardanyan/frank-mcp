  - title: Usability test vs customer interview
    url: https://nar-vardanyan.github.io/frank-mcp/glossary/usability-test-vs-customer-interview.html
    updated: 2026-11-27T09:00:00Z
    summary: A usability test watches someone try a task in a product or design. A customer interview asks about a real event or job in their life. They answer different questions.
  - title: Saturation (qualitative research)
    url: https://nar-vardanyan.github.io/frank-mcp/glossary/saturation.html
    updated: 2026-11-27T09:00:00Z
    summary: "In qualitative research, saturation is the point at which new interviews largely repeat themes you already have, rather than adding new ones. It is a judgment, not a fixed count."
  - title: Leading question
    url: https://nar-vardanyan.github.io/frank-mcp/glossary/leading-question.html
    updated: 2026-11-27T09:00:00Z
    summary: "A leading question nudges someone toward a particular answer by smuggling in a preference, a cause, or a compliment. Open questions about a recent event are a clearer start."
  - title: Interview guide
