  - scope:
      path: about-frank-ai-researcher.md
    values:
      description: "About Frank AI Researcher: a voice-first software product that runs AI-moderated voice interviews with your own customers. It is not a person or an academic researcher. Built by Prelaunch Group, Inc. The product website is https://www.hifrank.ai."
