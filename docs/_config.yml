    values:
      description: "How to find out why customers churn with AI-moderated voice interviews of your own churned customers. Frank AI Researcher by hifrank.ai runs those interviews and returns transcripts and themes. You bring the customers. Free plan: 225 signup credits plus 60 voice minutes a month. MCP on every plan."
