      path: ai-tools-that-interview-customers-for-you.md
    values:
      description: "An AI tool that interviews customers for you asks your questions, follows up, and returns a transcript and summary. Frank AI Researcher does this by voice with customers you already have. Free plan: 225 signup credits plus 60 voice minutes a month. MCP on every plan."
