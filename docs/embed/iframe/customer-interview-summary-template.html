uote:</code>, <code>question:</code>, <code>next:</code>. Lines in quote marks or starting with <code>&gt;</code> become quotes. Lines that ask a question become open questions. Anything else goes to Other notes.</p>\n      </div>\n      <div class=\"checkrow field\"><label><input type=\"checkbox\" id=\"blank\"> Show every section, with prompts for the empty ones (blank template)</label></div>\n      <div class=\"actions\">\n        <button class=\"btn btn-primary\" type=\"submit\">Make my summary</button>\n        <button class=\"btn btn-ghost\" type=\"button\" id=\"clear\">Clear the example</button>\n      </div>\n    </form>\n\n    <section id=\"result\" aria-labelledby=\"result-title\">\n      <h2 id=\"result-title\" style=\"border:0;margin:8px 0 4px;font-size:1.1em;color:var(--muted)\">Your summary</h2>\n      <div id=\"checks\"></div>\n      <article class=\"guide doc\" id=\"doc\" aria-live=\"polite\">\n        <h2>Customer interview summary</h2><ul class=\"meta-list\"><li><strong>Participant:</strong> P3</li><li><strong>Role:</strong> Operations manager</li><li><strong>Segment:</strong> Small logistics teams</li><li><strong>Interview type:</strong> Discovery (problems and current workflow)</li><li><strong>Research question:</strong> How do small teams plan delivery routes today?</li></ul><h3>Top takeaway</h3><p class=\"say\" id=\"takeaway-out\">Route planning is a Monday ritual held together by a shared spreadsheet and one person's memory.</p><h3 data-section=\"insight\">Key insights <span class=\"tag\">1</span></h3><ul><li>The spreadsheet is the real product they rely on; the routing tool is only used to print maps</li></ul><h3 data-section=\"goal\">What they are trying to get done <span class=\"tag\">1</span></h3><ul><li>Get every driver out the door with a route before 8</li></ul><h3 data-section=\"trigger\">What set it off <span class=\"tag\">1</span></h3><ul><li>A new driver got lost twice in one week and a key customer complained</li></ul><h3 data-section=\"pain\">Pains <span class=\"tag\">2</span></h3><ul><li>Re-planning when a driver calls in sick means redoing the whole sheet</li><li>Only Dana knows which customers need a call before delivery</li></ul><h3 data-section=\"workaround\">How they cope today <span class=\"tag\">1</span></h3><ul><li>Color codes in a shared spreadsheet plus a group chat for changes</li></ul><h3 data-section=\"quote\">Quotes (verbatim) <span class=\"tag\">2</span></h3><blockquote>&quot;Honestly the sheet works until Dana is on holiday.&quot; (14:05)</blockquote><blockquote>&quot;Last month we paid overtime three Mondays in a row because of re-planning.&quot; (21:30)</blockquote><h3 data-section=\"question\">Open questions <span class=\"tag\">1</span></h3><ul><li>What did they try before the spreadsheet?</li></ul><h3 data-section=\"next\">Next steps <span class=\"tag\">1</span></h3><ul class=\"next\"><li>Ask two more small teams how they handle sick days</li></ul><h3 data-section=\"other\">Other notes <span class=\"tag\">1</span></h3><ul><li>Uses a 2019 laptop in the depot</li></ul>\n      </article>\n      <div class=\"actions js-only\">\n        <button class=\"btn btn-ghost\" type=\"button\" id=\"copy\">Copy as Markdown</button>\n        <button class=\"btn btn-ghost\" type=\"button\" id=\"copy-text\">Copy as plain text</button>\n        <button class=\"btn btn-ghost\" type=\"button\" id=\"dl-md\">Download .md</button>\n        <span class=\"status\" id=\"status\" role=\"status\"></span>\n      </div>\n    </section>" + feCredit("customer-interview-summary-template", el);

var SUM = (function () {

    { key: "next", title: "Next steps", prompt: "Action, owner and date." },
    { key: "other", title: "Other notes", prompt: "Anything that did not fit above." }
  ];
  // Prefixes people type in notes. Order matters only for readability; matching is on the whole word before the colon.
  var PREFIX = {
    insight: "insight", learning: "insight", finding: "insight", takeaway: "insight",
    goal: "goal", job: "goal", jtbd: "goal", want: "goal", wants: "goal",
    trigger: "trigger", why: "trigger", event: "trigger",
    pain: "pain", problem: "pain", issue: "pain", frustration: "pain", struggle: "pain",
    workaround: "workaround", today: "workaround", hack: "workaround", alternative: "workaround", tools: "workaround",
    quote: "quote", said: "quote", verbatim: "quote",
    question: "question", unknown: "question", ask: "question", open: "question",
    next: "next", todo: "next", action: "next", "follow up": "next", "follow-up": "next", followup: "next",
    note: "other", other: "other", context: "other"
  };
  function clean(s, max) { return String(s == null ? "" : s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, "").replace(/\s+/g, " ").trim().slice(0, max || MAXLEN); }
  function sortLine(raw) {
    var s = clean(raw);
    s = s.replace(/^(?:[-*\u2022]|\d+[.)])(?:\s+|$)/, "");
    if (!s) return null;

    var m = s.match(/^([A-Za-z][A-Za-z -]{0,14}?)\s*:\s*(.+)$/);
    if (m && PREFIX[m[1].toLowerCase()]) return { key: PREFIX[m[1].toLowerCase()], text: m[2].trim() };
    if (/^["\u201c].+["\u201d](?:\s*\(?[\w :.,-]{0,30}\)?)?$/.test(s)) return { key: "quote", text: s };

    return { key: "other", text: s };
  }
  function sortNotes(text) {

    String(text == null ? "" : text).split(/\r?\n/).slice(0, MAXLINES).forEach(function (l) { var r = sortLine(l); if (r && r.text) out[r.key].push(r.text); });
    return out;

  function build(o) {

    r.checks = [];
    if (r.total && !r.counts.quote) r.checks.push("No quotes yet. Add at least one verbatim quote so others can check each insight against what was said.");
    if (r.counts.insight && r.counts.quote && r.counts.insight > r.counts.quote) r.checks.push("More insights than quotes. Make sure every insight points to something the person actually said.");
    if (r.total && !r.counts.next) r.checks.push("No next steps. Add at least one action with an owner and a date.");

  function mdEsc(s) { return String(s).replace(/([\\`*_[\]<>|#])/g, "\\$1"); }
  function toMarkdown(r, cta) {
