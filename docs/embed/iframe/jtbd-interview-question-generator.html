lass=\"phase-goal\">The moment interest turned into a search, and what they compared.</p><ol start=\"3\"><li class=\"q\" data-force=\"push\"><span class=\"tag push\">Push</span>What happened that made you start looking seriously? Why then and not a month earlier?<span class=\"probe\">Probe: Look for a dated event: a deadline, a cost, a complaint, a new boss, a failure. Ask how much time passed since the first thought.</span></li><li class=\"q\" data-force=\"pull\"><span class=\"tag pull\">Pull</span>Which options did you look at, including doing nothing or building something yourself? Where did you find them?<span class=\"probe\">Probe: Ask how each option got onto the list and which one they almost picked.</span></li></ol><h3 data-phase=\"decide\">Deciding</h3><p class=\"phase-goal\">The pull of the chosen option and the worries at the moment of choice.</p><ol start=\"5\"><li class=\"q\" data-force=\"pull\"><span class=\"tag pull\">Pull</span>What made you pick Acme Invoicing over the others? Tell me about the moment you knew.<span class=\"probe\">Probe: If they name a feature, ask what that feature let them do that they couldn't do before.</span></li><li class=\"q\" data-force=\"anxiety\"><span class=\"tag anxiety\">Anxiety</span>What worried you just before you signed up or paid? What made the worry go away?<span class=\"probe\">Probe: Ask what reduced the worry: a free plan, a review, a colleague, a refund policy.</span></li></ol><h3 data-phase=\"after\">First use and the new normal</h3><p class=\"phase-goal\">Compare the progress they expected with what they got.</p><ol start=\"7\"><li class=\"q\" data-force=\"progress\"><span class=\"tag progress\">Progress</span>Tell me about the first time you used Acme Invoicing. What did you do first, and what happened?<span class=\"probe\">Probe: Ask what they expected it to do that it did, or did not do. A gap here is a churn risk.</span></li><li class=\"q\" data-force=\"habit\"><span class=\"tag habit\">Habit</span>What // JTBD switch interview question generator: templates only, no network, no AI model.

      { id: "aw2", phase: "first", force: "push", core: true, q: "When did you first feel that {P} was not working for you anymore? What happened that day?", probe: "Keep going back in time until they reach the first moment. Ask what else changed around then: team, budget, volume." },

      { id: "aw4", phase: "passive", force: "pull", core: false, q: "After that, what did you notice about other ways to do this?", probe: "Ask about posts, conversations, ads and tools colleagues used." },
      { id: "aw5", phase: "passive", force: "habit", core: false, q: "What kept you on {P} for a while after that?", probe: "Listen for setup work, data already in the product, or a team that was used to it." },
      { id: "aw6", phase: "event", force: "push", core: true, q: "What happened that made you decide to leave? Why then and not a month earlier?", probe: "Look for a dated event: a renewal, a price change, a missed deadline, a new person in charge." },
